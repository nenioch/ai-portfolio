<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humanoids Showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="scene" aria-label="Animatie van humanoïde robots in productie, logistiek, huishouden, zorg, inspectie en sport"></canvas>
<div id="vignette"></div>
<div id="fade"></div>
<div class="bar top"></div>
<div class="bar bottom"></div>

<div id="rec" class="overlay"><i></i>REC <span id="tc">00:00:00:00</span></div>
<ul id="hud" class="overlay"></ul>

<div id="lower" class="overlay">
  <span id="lower-idx">01 / 08</span>
  <h2 id="lower-title"></h2>
  <p id="lower-sub"></p>
</div>

<div id="card" class="overlay">
  <h1 id="card-big"></h1>
  <p id="card-small"></p>
  <p id="card-note"></p>
</div>

<div id="controls">
  <button id="prev" aria-label="Vorige scène">
    <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
  </button>
  <button id="play" aria-label="Pauzeren">
    <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>
  </button>
  <button id="next" aria-label="Volgende scène">
    <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
  </button>
  <div id="timeline"></div>
  <span id="time">0:00 / 0:00</span>
</div>

<div id="paused-hint">Gepauzeerd · spatie om verder te gaan · ← → scènes · H verbergt overlays</div>
<div id="error" hidden>Je browser ondersteunt geen WebGL, dus de animatie kan niet worden getoond.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="env.js"></script>
<script src="robot.js"></script>
<script src="poses.js"></script>
<script src="scenes.js"></script>
<script src="director.js"></script>
<script src="main.js"></script>
</body>
</html>
