<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AI Revolution – Wait But Why</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Filmisch, schermvullend (opzet als heelal).
   Diep zwart, goud voor de mens en cyaan voor de machine. */
:root {
  --ink: #f4efe4;
  --muted: rgba(244, 239, 228, 0.68);
  --dim: rgba(244, 239, 228, 0.45);
  --accent: #e0a845;
  --panel: rgba(10, 10, 16, 0.5);
  --line: rgba(244, 239, 228, 0.14);
  --display: 'Young Serif', Georgia, 'Times New Roman', serif;
  --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; color: var(--ink); font-family: var(--sans); overflow: hidden; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }

.overlay { z-index: 3; pointer-events: none; transition: opacity 0.4s; }
body.clean .overlay { opacity: 0 !important; }

/* ------------------------------------------------------------ kop + klok */
#kop { position: fixed; top: 20px; left: 24px; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6); }
.eyebrow { font: 600 11px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.naam { margin-top: 6px; font: 400 18px/1.1 var(--display); color: var(--ink); }

#klok { position: fixed; top: 16px; right: 24px; max-width: 58vw; display: grid; justify-items: end; gap: 6px; text-align: right; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.7); }
#clock { font: 500 clamp(17px, 2.3vw, 28px)/1.15 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
#scene-no { font: 500 11px/1 var(--mono); letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }

/* ------------------------------------------------------------ onderbalk-tekst */
#lower {
  position: fixed; left: clamp(16px, 4vw, 56px); bottom: 92px;
  width: min(520px, calc(100vw - 32px));
}
#lower::before {
  content: ''; display: block; height: 2px; width: 0; margin-bottom: 14px;
  background: var(--accent); transition: width 0.8s var(--ease);
}
#lower.show::before { width: 56px; }
#lower > * { opacity: 0; transform: translateY(12px); transition: opacity 0.6s, transform 0.7s var(--ease); }
#lower.show > * { opacity: 1; transform: none; }
#lower.show #lower-title { transition-delay: 0.1s; }
#lower.show #lower-txt { transition-delay: 0.25s; }
#lower.show #lower-fact { transition-delay: 0.45s; }
#lower-idx { display: block; margin-bottom: 8px; font: 500 11px/1.3 var(--mono); letter-spacing: 0.2em; color: var(--accent); }
#lower-title { font: 400 clamp(30px, 4.6vw, 54px)/1.02 var(--display); text-wrap: balance; text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55); }
#lower-txt { margin-top: 12px; font: 400 clamp(14px, 1.35vw, 17px)/1.5 var(--sans); color: var(--ink); text-shadow: 0 1px 14px rgba(0, 0, 0, 0.85); max-width: 60ch; }
#lower-fact {
  margin-top: 12px; padding: 9px 12px; font: 400 13px/1.45 var(--sans); color: var(--muted);
  background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-left: 2px solid var(--accent); max-width: 60ch;
}
#lower-fact b { color: var(--ink); font-weight: 600; }

/* ------------------------------------------------------------ bediening */
#controls {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
  width: min(860px, calc(100vw - 32px));
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px 6px 6px;
  background: rgba(10, 10, 16, 0.62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 12px;
  z-index: 5; transition: opacity 0.5s;
}
body.idle #controls, body.idle #hint { opacity: 0; }
body.idle { cursor: none; }
body.idle #scene { cursor: none; }
#controls > button {
  flex: none; width: 34px; height: 34px; border: 0; border-radius: 8px;
  background: none; color: var(--ink); display: grid; place-items: center; cursor: pointer;
}
#controls > button:hover { background: rgba(255, 255, 255, 0.08); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button svg { width: 16px; height: 16px; fill: currentColor; }
#play .i-play { display: none; }
#play.paused .i-play { display: block; }
#play.paused .i-pause { display: none; }

#timeline { flex: 1; min-width: 0; display: flex; gap: 3px; height: 26px; align-items: center; margin-left: 6px; }
.seg { position: relative; flex: 1 1 0; min-width: 0; height: 26px; border: 0; background: none; cursor: pointer; }
.seg::before { content: ''; position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: rgba(255, 255, 255, 0.18); border-radius: 2px; transition: top 0.2s, height 0.2s; }
#timeline:hover .seg::before { top: 9.5px; height: 7px; }
.seg i { position: absolute; left: 0; top: 11px; height: 4px; width: 0; background: var(--ink); border-radius: 2px; transition: top 0.2s, height 0.2s; }
#timeline:hover .seg i { top: 9.5px; height: 7px; }
.seg.cur i { background: var(--accent); }
.seg span {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  padding: 4px 7px; border-radius: 4px; background: rgba(0, 0, 0, 0.78); color: var(--ink);
  font: 500 10px/1 var(--mono); letter-spacing: 0.08em; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.seg:first-child span { left: 0; transform: none; }
.seg:last-child span { left: auto; right: 0; transform: none; }
.seg:hover span, .seg:focus-visible span { opacity: 1; }
#time { flex: none; min-width: 84px; text-align: right; font: 500 11px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

#hint {
  position: fixed; right: 24px; bottom: 74px; z-index: 4;
  font: 400 11px/1.4 var(--mono); letter-spacing: 0.04em; color: var(--dim);
  pointer-events: none; transition: opacity 0.5s; text-align: right;
}

/* ------------------------------------------------------------ muziek */
#mute .i-off { display: none; }
#mute.off .i-on { display: none; }
#mute.off .i-off { display: block; }
#own.active { color: var(--accent); }

#music-tag {
  position: fixed; right: 24px; bottom: 92px; z-index: 4; max-width: 46vw;
  font: 500 10px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim);
  text-align: right; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7);
}
body:not(.idle) #music-tag { opacity: 0; }

@media (max-width: 760px) {
  #hint { display: none; }
  #music-tag { display: none; }
  #lower { bottom: 70px; }
  #lower-txt { font-size: 14px; }
  #lower-fact { display: none; }
  #time { display: none; }
  #kop { display: none; }
  #klok { right: 16px; top: 12px; max-width: calc(100vw - 32px); }
}
@media (prefers-reduced-motion: reduce) {
  #lower > *, #lower::before { transition-duration: 0.01s !important; }
}

</style>
</head>
<body>

    <svg class="i-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM15.3 9.3l1.2-1.2 2.2 2.2 2.2-2.2 1.2 1.2-2.2 2.2 2.2 2.2-1.2 1.2-2.2-2.2-2.2 2.2-1.2-1.2 2.2-2.2z"/></svg>
  </button>
  <button id="own" type="button" aria-label="Eigen muziekbestand kiezen" title="Eigen muziekbestand kiezen">
    <svg viewBox="0 0 24 24"><path d="M9 4v10.6A3.5 3.5 0 1 0 11 18V8h7V4z"/></svg>

</div>

<div id="music-tag" class="overlay"></div>

<div id="hint">Klik of spatie pauzeert · ← → scènes · H verbergt de tekst · M dempt de muziek</div>

<audio id="track" src="muziek/soundtrack.mp3" preload="auto" loop></audio>
<script>
(() => {
const SCENES = [
  { t: '1750', meta: 'een gedachte-experiment', title: 'De tijdreiziger',
    txt: "Haal iemand uit het jaar 1750 naar vandaag. Hij ziet metalen kokers door de lucht vliegen, praat met mensen aan de andere kant van de oceaan en kijkt naar een wedstrijd die duizenden kilometers verderop gespeeld wordt. Volgens Tim Urban zou hij dat van pure verbijstering misschien niet overleven.",
    fact: '<b>Die Progress Unit:</b> zo noemt Urban de hoeveelheid vooruitgang waar je van omvalt. Iemand uit 1500 zou van 1750 lang niet zo schrikken. Wil de man uit 1750 zelf iemand zo laten schrikken, dan moet hij terug tot vóór de landbouw, zo’n 12.000 jaar eerder.',
    marks: [[0, '1750'], [.38, 'door de tijd'], [.55, '2015']] },
  { t: 'versnelling', meta: 'de wet van de versnellende meeropbrengst', title: 'Steeds sneller',
    txt: "Vooruitgang versnelt zichzelf: wie verder is, kan sneller nog verder komen. Uitvinder Ray Kurzweil noemt dit de wet van de versnellende meeropbrengst. Zoom in op welk stuk geschiedenis je maar wilt: de laatste stap is telkens de grootste.",
    fact: '<b>Kurzweil:</b> alle vooruitgang van de hele twintigste eeuw haalden we, in het tempo van het jaar 2000, al in twintig jaar. Hij verwacht dat de 21e eeuw duizend keer zoveel vooruitgang brengt als de twintigste.',
    marks: [[0, '12.000 v.Chr. → 2015'], [.4, '1750 → 2015'], [.72, '1950 → 2015']] },
  { t: 'nu', meta: 'hoe we de toekomst inschatten', title: 'Waarom we het niet zien',
    txt: "We voorspellen de toekomst door terug te kijken, en dan trekken we een rechte lijn. Maar vooruitgang loopt niet recht: de lijn wordt steeds steiler. Wie vanaf vandaag gewoon doortrekt, schat de komende decennia veel te laag in.",
    fact: '<b>S-curven:</b> elke nieuwe techniek groeit eerst langzaam, dan explosief en vlakt daarna af. Zet je al die S-curven achter elkaar, dan vormen ze samen één steeds steilere lijn.',
    marks: [[0, 'terugkijken'], [.28, 'wat we verwachten'], [.5, 'wat er gebeurt'], [.72, 'S-curven']] },
  { t: 'ANI · AGI · ASI', meta: 'drie soorten kunstmatige intelligentie', title: 'Drie niveaus van AI',
    txt: "Smalle AI (ANI) is goed in één ding, zoals schaken. Algemene AI (AGI) is op alle fronten even slim als een mens: redeneren, plannen, leren van ervaring. Superintelligentie (ASI) is slimmer dan de slimste mensen, op elk gebied, en misschien wel miljoenen keren.",
    fact: '<b>Het kantelpunt:</b> ANI hebben we al overal. De sprong naar AGI is de moeilijke stap. Volgens Urban kan de stap daarna, van AGI naar ASI, juist verrassend snel gaan.',
    marks: [[0, 'ANI · smalle AI'], [.33, 'AGI · algemene AI'], [.6, 'ASI · superintelligentie']] },
  { t: '2015', meta: 'de wereld in 2015', title: 'Smalle AI is overal',
    txt: "Je merkt het nauwelijks, maar AI draait al overal: de spamfilter in je mailbox, de routeplanner in je auto, de vertaalmachine, de aanbevelingen in webwinkels en de algoritmes die op de beurs handelen. Elk systeem is slim in precies één ding.",
    fact: '<b>Bouwstenen:</b> elke smalle AI is op zichzelf niet gevaarlijk en niet algemeen slim. Urban vergelijkt ze met de aminozuren in de oersoep: bouwstenen waaruit iets veel groters kan ontstaan.',
    marks: [[0, '2015'], [.1, 'smalle AI, overal']] },
  { t: 'paradox', meta: 'waarom AGI zo moeilijk is', title: 'Moeilijk is makkelijk',
    txt: "Wat voor ons moeilijk is, zoals rekenen met getallen van zeven cijfers, doet een computer in een flits. Wat voor ons kinderspel is, zoals een kat herkennen of over een stoep lopen, is voor een computer juist ontzettend moeilijk. Daar heeft de evolutie honderden miljoenen jaren aan geschaafd.",

  { t: '10¹⁶', meta: 'rekenkracht per 1000 dollar', title: 'Genoeg rekenkracht',

    fact: '<b>Tianhe-2:</b> de Chinese supercomputer haalde zo’n 34 biljard berekeningen per seconde, besloeg 720 m², gebruikte 24 megawatt en kostte 390 miljoen dollar. Een brein werkt op zo’n 20 watt.',

    fact: '<b>302 neuronen:</b> van een wormpje van 1 millimeter is al lang alle bedrading van het zenuwstelsel in kaart gebracht. Een mensenbrein heeft zo’n 86 miljard neuronen.',
    marks: [[0, 'het brein nabootsen'], [.52, 'de evolutie nadoen'], [.84, 'zichzelf verbeteren']] },
  { t: 'snelheid', meta: 'waarom een digitaal brein in het voordeel is', title: 'Sneller dan biologie',
    txt: "Zelfs met precies dezelfde intelligentie als een mens heeft een computer grote voordelen. Hij rekent miljoenen keren sneller, zijn signalen reizen bijna met de snelheid van het licht, hij vergeet niets, wordt nooit moe en kan zichzelf in een oogwenk kopiëren.",
    fact: '<b>200 tegen 2 miljard:</b> neuronen vuren hooguit zo’n 200 keer per seconde, een gewone processor tikt 2 miljard keer per seconde. Signalen in je hersenen gaan zo’n 120 meter per seconde.',
    marks: [[0, 'rekensnelheid'], [.33, 'signaalsnelheid'], [.62, 'kopiëren en samenwerken']] },
  { t: 'de trap', meta: 'de trap van intelligentie', title: 'Twee treden hoger',
    txt: "Zet alle soorten op een trap van intelligentie. Een chimpansee staat net onder ons. Hij kan een wolkenkrabber zien, maar nooit begrijpen dat mensen die gebouwd hebben. Een machine die twee treden boven ons staat, zou voor ons net zo onbegrijpelijk zijn. En een superintelligentie staat véél hoger.",
    fact: '<b>Dorpsgek en Einstein:</b> wij vinden het verschil tussen die twee enorm. Op de trap van alle mogelijke intelligentie staan ze vrijwel naast elkaar.',

    fact: '<b>Na AGI:</b> volgens dezelfde experts is er 10 procent kans dat ASI binnen 2 jaar na AGI volgt, en 75 procent kans binnen 30 jaar. Het artikel verscheen in januari 2015; de witte lijn markeert vandaag.',

const DUR = 12, TOTAL = DUR * SCENES.length;
const W = 960, H = 540, TAU = Math.PI * 2;

const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let T = 0, playing = true, last = performance.now();

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const span = (p, a, b) => clamp((p - a) / (b - a));

// goud voor de mens, cyaan voor de machine
const INK = '#f4efe4', MUT = 'rgba(244,239,228,.68)', DIM = 'rgba(244,239,228,.42)', ACC = '#e0a845', CYAN = '#8fd8ff';

/* ---------- drawing helpers ---------- */

/* ---------- city and village ---------- */
const TOWERS = Array.from({ length: 22 }, (_, i) => ({ x: i * 46 - 10 + hash(i * 3 + .2) * 14, w: 30 + hash(i * 5 + .4) * 26, h: 80 + Math.pow(hash(i * 7 + .6), 1.5) * 230 }));
function skyline(base, a, lit) {

  for (const b of TOWERS) {
    ctx.globalAlpha = a; ctx.fillStyle = '#0b0f1c'; ctx.fillRect(b.x, base - b.h, b.w, b.h);
    for (let wy = base - b.h + 8; wy < base - 6; wy += 9) for (let wx = b.x + 4; wx < b.x + b.w - 5; wx += 7) {
      const h = hash(wx * 1.3 + wy * 7.1); if (h > lit) continue;
      ctx.fillStyle = h < lit * .2 ? '#9fd8ff' : '#ffd890'; ctx.globalAlpha = a * (.3 + .5 * hash(wy * .7 + wx)); ctx.fillRect(wx, wy, 3, 4);
    }

const HOUSES = [[40, 64, 46], [130, 84, 58], [240, 60, 42], [330, 76, 54], [560, 70, 50], [660, 92, 62], [790, 66, 48], [880, 80, 56]];
function village(base, a) {
  if (a <= 0) return;
  ctx.globalAlpha = a; ctx.fillStyle = '#1c130d';
  ctx.fillRect(452, base - 150, 44, 150);
  ctx.beginPath(); ctx.moveTo(448, base - 150); ctx.lineTo(474, base - 215); ctx.lineTo(500, base - 150); ctx.fill();
  for (const [x, w, h] of HOUSES) {
    ctx.fillRect(x, base - h, w, h);
    ctx.beginPath(); ctx.moveTo(x - 6, base - h); ctx.lineTo(x + w / 2, base - h - w * .45); ctx.lineTo(x + w + 6, base - h); ctx.fill();
    ctx.fillRect(x + w * .7, base - h - w * .45, 8, w * .3);
  }
  for (const [x, w, h] of HOUSES) {
    const fl = .7 + .3 * Math.sin(T * 9 + x);
    ctx.globalAlpha = a * fl * .9; ctx.fillStyle = '#ffb45a'; ctx.fillRect(x + w * .3, base - h * .6, 9, 11);
    glow(x + w * .3 + 4, base - h * .6 + 5, 22, .25 * a * fl, '255,170,80');

/* ---------- globe (as in heelal) ---------- */
const LAND = [], CLOUDS = [];
for (let c = 0; c < 12; c++) {
  const clat = (hash(c * 7.3) - .5) * 2.0, clon = hash(c * 3.7) * TAU;
  for (let j = 0; j < 7; j++) LAND.push({ lat: clat + (hash(c * 10 + j) - .5) * .5, lon: clon + (hash(c * 20 + j) - .5) * .7, s: .12 + hash(c * 30 + j) * .14 });
}
for (let k = 0; k < 22; k++) CLOUDS.push({ lat: (hash(k * 41) - .5) * 2.4, lon: hash(k * 43) * TAU, s: .06 + hash(k * 47) * .12 });
function globe(cx, cy, R, rotY, o) {
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  ctx.globalAlpha = 1; ctx.fillStyle = o.base; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  const surf = (list, col, a, extra) => {
    ctx.fillStyle = col; ctx.globalAlpha = a;
    for (const pt of list) {
      const lon = pt.lon + rotY + extra, cl = Math.cos(pt.lat), z = cl * Math.cos(lon);
      if (z < -.05) continue;
      ctx.beginPath();
      ctx.ellipse(cx + R * cl * Math.sin(lon), cy - R * Math.sin(pt.lat), Math.max(.5, pt.s * R * Math.max(.08, Math.cos(lon))), pt.s * R * Math.max(.25, cl) * .8, 0, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
  surf(LAND, o.land, 1, 0);
  if (o.clouds > 0) surf(CLOUDS, '#ffffff', o.clouds * .7, T * .05);
  if (o.extra) o.extra();
  const g = ctx.createRadialGradient(cx - R * .55, cy - R * .3, R * .05, cx - R * .3, cy - R * .15, R * 1.45);
  g.addColorStop(0, 'rgba(255,250,235,.18)'); g.addColorStop(.45, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,6,.88)');
  ctx.fillStyle = g; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  ctx.restore();
  if (o.atmoA > 0) {
    const a = ctx.createRadialGradient(cx, cy, R * .9, cx, cy, R * 1.16);
    a.addColorStop(0, `rgba(${o.atmo},0)`); a.addColorStop(.38, `rgba(${o.atmo},${o.atmoA})`); a.addColorStop(1, `rgba(${o.atmo},0)`);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = a; ctx.fillRect(cx - R * 1.2, cy - R * 1.2, R * 2.4, R * 2.4); ctx.restore();
  }
}

/* ---------- scenes ---------- */
function scene0(p, lt) { // the time traveller from 1750
  const m = ease(span(p, .44, .56)), base = 440, tx = 640;
  sky(mix('#120b08', '#060b1c', m), mix('#2c1c10', '#1b2440', m));
  stars(.7 * (1 - m) + .2 * m, 360);
  if (m < 1) { glow(820, 90, 60, .25 * (1 - m), '255,240,210'); disc(820, 90, 16, '#f1e8d0', 1 - m); }
  village(base, 1 - m);
  if (m > 0) {
    glow(W / 2, base, 520, .22 * m, '255,170,90');
    skyline(base, m, .55);
    const px = W + 60 - (lt * 70) % (W + 120);
    disc(px, 70, 1.4, '#fff', m); if (Math.sin(lt * 7) > .5) disc(px + 9, 71, 1.4, '#ff4a4a', m);
  }
  ctx.globalAlpha = 1; ctx.fillStyle = mix('#140d08', '#0b0e18', m); ctx.fillRect(0, base, W, H - base);
  if (m > 0) {
    for (let k = 0; k < 6; k++) {
      const x = ((k * 173 + lt * (60 + k * 13)) % (W + 80)) - 40;
      ctx.globalAlpha = m; ctx.fillStyle = k % 2 ? '#ff5a4a' : '#fff1c8'; ctx.fillRect(x, base + 22 + (k % 2) * 8, 6, 2);
    }
    ctx.globalAlpha = 1;
    figure(770, base, 1.3, { col: '#8d97b0', a: m });
    glow(782, base - 36, 14, .8 * m, CY); disc(782, base - 36, 2.5, CYAN, m);
  }
  const por = span(p, .3, .44) * (1 - span(p, .56, .7));
  if (por > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 60; k++) {
      const y = 60 + hash(k * 3) * 400, len = 40 + hash(k * 5) * 200, x = ((hash(k * 7) * W + lt * 1600 * (.5 + hash(k))) % (W + len)) - len;
      ctx.globalAlpha = por * .5; ctx.fillStyle = k % 3 ? '#9fd8ff' : '#ffd890'; ctx.fillRect(x, y, len, 1.5);
    }
    ctx.restore();
    glow(tx, base - 40, 160 * por, .7 * por, '200,230,255');
  }
  const fall = ease(span(p, .82, .9)), shock = span(p, .62, .7) * (1 - fall);
  figure(tx, base, 1.5, { col: '#eadfc8', hat: true, fall, arms: shock });
  if (shock > 0) {
    ctx.strokeStyle = ACC; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let k = 0; k < 5; k++) {
      const a = -2.5 + k * .5, hy = base - 77;
      ctx.globalAlpha = shock * (.55 + .45 * Math.sin(lt * 14 + k));
      ctx.beginPath(); ctx.moveTo(tx + Math.cos(a) * 18, hy + Math.sin(a) * 18); ctx.lineTo(tx + Math.cos(a) * 28, hy + Math.sin(a) * 28); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (p > .44) { const f = 1 - span(p, .44, .58); if (f > 0) { ctx.fillStyle = `rgba(235,245,255,${.85 * f})`; ctx.fillRect(0, 0, W, H); } }
}

const INV = [[-10000, 'landbouw'], [-3200, 'schrift'], [1450, 'boekdrukkunst'], [1769, 'stoommachine'], [1879, 'gloeilamp'], [1903, 'vliegtuig'], [1946, 'computer'], [1969, 'maanlanding'], [1991, 'web'], [2007, 'smartphone']];
const yearTxt = y => y < 0 ? nl(-y) + ' v.Chr.' : String(Math.round(y));
function scene1(p, lt) { // accelerating returns, at every zoom level
  bg(); stars(.3);
  const X0 = 340, X1 = 900, Y0 = 400, Y1 = 70;
  const z1 = ease(span(p, .32, .5)), z2 = ease(span(p, .64, .82));
  const wid = Math.exp(lerp(lerp(Math.log(14015), Math.log(265), z1), Math.log(65), z2)), x0 = 2015 - wid;
  const f = y => 1 / (2045 - y), f0 = f(x0), f1 = f(2015);
  const X = y => X0 + (X1 - X0) * (y - x0) / wid, Y = y => Y0 + (Y1 - Y0) * (f(y) - f0) / (f1 - f0);
  axes(X0, Y0, X1 + 14, Y1 - 12);
  text('MENSELIJKE VOORUITGANG', X0 + 8, Y1 - 14, { size: 10, col: DIM });
  text(yearTxt(x0), X0, Y0 + 20, { size: 11, col: MUT });
  text('2015', X1, Y0 + 20, { size: 11, col: MUT, align: 'right' });
  const d = ease(span(p, .03, .28)), pts = [];
  for (let k = 0; k <= 240; k++) { const yr = x0 + wid * (1 - Math.pow(1 - d * k / 240, 3)); pts.push([X(yr), Y(yr)]); }
  path(pts, ACC, 2.5);
  const tip = pts[pts.length - 1]; glow(tip[0], tip[1], 34, .6, GD);
  let lx = -99, ly = 999;
  for (const [yr, name] of INV) {
    if (yr < x0 || 1 - Math.cbrt(1 - (yr - x0) / wid) > d) continue;
    const x = X(yr), y = Y(yr);
    disc(x, y, 3, INK);
    if (Math.hypot(x - lx, y - ly) < 30) continue;
    lx = x; ly = y;
    const steep = (Y(Math.min(2015, yr + wid * .02)) - y) / (X(Math.min(2015, yr + wid * .02)) - x || 1);
    if (x > X1 - 60 || steep < -.5) text(name, x - 9, y + 4, { size: 11, col: MUT, align: 'right' });
    else { ctx.save(); ctx.translate(x + 4, y - 9); ctx.rotate(-.6); text(name, 0, 0, { size: 11, col: MUT }); ctx.restore(); }
  }
}

function scene2(p, lt) { // linear intuition vs exponential reality
  bg(); stars(.25);
  const X0 = 340, X1 = 910, Y0 = 400, Y1 = 60, un = .55, k = 4.2;
  const v = u => (Math.exp(k * u) - 1) / (Math.exp(k) - 1), Q = u => [lerp(X0, X1, u), lerp(Y0, Y1, v(u))];
  axes(X0, Y0, X1 + 10, Y1 - 8);
  text('VOORUITGANG', X0 + 8, Y1 - 10, { size: 10, col: DIM });
  text('TIJD →', X1 + 10, Y0 + 20, { size: 10, col: DIM, align: 'right' });
  const [nx, ny] = Q(un);
  path([[nx, Y0], [nx, Y1 + 20]], 'rgba(244,239,228,.22)', 1, 1, [3, 5]);
  text('NU', nx, Y0 + 20, { size: 11, col: ACC, align: 'center' });
  const d0 = ease(span(p, 0, .25)), past = [];
  for (let j = 0; j <= 80; j++) past.push(Q(un * d0 * j / 80));
  path(past, INK, 2.5);
  const d1 = ease(span(p, .28, .45));
  if (d1 > 0) {
    const s = (v(un) - v(un - .08)) / .08, ue = lerp(un, 1, d1);
    path([[nx, ny], [lerp(X0, X1, ue), lerp(Y0, Y1, v(un) + s * (ue - un))]], 'rgba(244,239,228,.75)', 2, 1, [6, 6]);
    tag(X1 - 150, lerp(Y0, Y1, v(un) + s * (1 - un)) + 30, 'wat we verwachten', span(d1, .8, 1));
  }
  const d2 = ease(span(p, .5, .68));
  if (d2 > 0) {
    const fut = []; for (let j = 0; j <= 80; j++) fut.push(Q(lerp(un, un + (1 - un) * d2, j / 80)));
    path(fut, ACC, 3);
    const e = fut[fut.length - 1]; glow(e[0], e[1], 36, .6, GD);
    tag(640, 100, 'wat er waarschijnlijk gebeurt', span(d2, .8, 1), ACC);
  }
  const d3 = span(p, .72, .9);
  if (d3 > 0) {
    const B = [0, .22, .4, .55, .68, .8, .9, 1];
    for (let i = 0; i < B.length - 1; i++) {
      const a = span(d3, i / 8, i / 8 + .2); if (a <= 0) continue;
      const u0 = B[i], u1 = B[i + 1], s0 = 1 / (1 + Math.exp(5)), s1 = 1 / (1 + Math.exp(-5)), q = [];
      for (let j = 0; j <= 30; j++) {
        const t = j / 30, s = (1 / (1 + Math.exp(-(t - .5) * 10)) - s0) / (s1 - s0);
        q.push([lerp(X0, X1, lerp(u0, u1, t)) + 6, lerp(Y0, Y1, lerp(v(u0), v(u1), s)) + 6]);
      }
      path(q, CYAN, 1.5, a * .8);
    }
  }
  figure(nx, ny, .8);
}

function orb(x, y, r, a, col, n, lt) {
  if (a <= 0) return;
  const rr = r * (.6 + .4 * a);
  glow(x, y, rr * 2.4, .4 * a, col);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgb(${col})`;
  for (let k = 0; k < n; k++) {
    const ang = hash(k * 3.1) * TAU + lt * (.3 + hash(k * 1.7) * .9) * (k % 2 ? 1 : -1), d = rr * (.25 + .85 * hash(k * 5.9));

  }
  ctx.restore();
  ctx.globalAlpha = a; ctx.strokeStyle = `rgba(${col},.85)`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
}
const ORBS = [[470, 16, CY, 'ANI', 'smalle AI', 'goed in één ding'], [600, 44, CY, 'AGI', 'algemene AI', 'zo slim als een mens'], [810, 110, '255,214,140', 'ASI', 'superintelligentie', 'slimmer dan alle mensen']];
function scene3(p, lt) { // ANI, AGI, ASI
  bg(); stars(.35);
  const starts = [.04, .32, .6];
  ORBS.forEach(([x, r, col, name, l1, l2], k) => {
    const a = ease(span(p, starts[k], starts[k] + .14)), y = 200;
    orb(x, y, r * (k === 2 ? 1 + .04 * Math.sin(lt * 2) : 1), a, col, [14, 60, 260][k], lt);
    text(name, x, 362, { f: 'serif', w: 400, size: 30, align: 'center', a });
    text(l1.toUpperCase(), x, 382, { size: 10, col: k === 2 ? ACC : CYAN, align: 'center', a });
    text(l2, x, 400, { f: 'sans', w: 400, size: 13, col: MUT, align: 'center', a });
  });
}

const LINKS = Array.from({ length: 16 }, (_, k) => [Math.floor(hash(k * 3 + .5) * TOWERS.length), Math.floor(hash(k * 5 + .7) * TOWERS.length)]).filter(([a, b]) => a !== b);
const NARROW = [[560, 92, 'spamfilter'], [730, 128, 'routeplanner'], [420, 150, 'vertaalmachine'], [390, 100, 'aanbevelingen'], [610, 178, 'schaakcomputer'], [840, 196, 'beurshandel'], [470, 222, 'spraakherkenning'], [700, 250, 'zelfrijdende auto']];
function scene4(p, lt) { // narrow AI everywhere
  const base = 450;
  sky('#050a1a', '#142040'); stars(.4, 300);
  glow(W / 2, base, 520, .18, '120,170,255');
  skyline(base, 1, .5);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [i, j] of LINKS) {

  { ch: ['Am', 'G', 'F', 'E'], i: [.55, .7], seq: [.9, 0, 1, 4, 6], kick: [0, 1, 1, .8] },                                 // sneller dan biologie
  { ch: ['Fmaj7', 'Am', 'F', 'Esus'], i: [.3, .65], lead: { from: .08, notes: RISE, vol: .55 }, bells: .2, swell: [.72] }, // de trap
  { ch: ['Am', 'F', 'C', 'G'], i: [.5, 1], seq: [1, 0, .96, 2, 8], kick: [.3, .96, 1, 1], swell: [.62] },                  // intelligentie-explosie
  { ch: ['Dm', 'Am'], i: [.3, .45], kick: [.1, .86, 2, .5], bells: .25, boom: [.86] },                                    // evenwichtsbalk
  { ch: ['F', 'C', 'G', 'Am'], i: [.4, .55], seq: [.5, 0, 1, 4, 4], bells: .3 },                                          // wanneer?
  { ch: ['C', 'G', 'Am', 'Em'], i: [.4, .45], lead: { from: .08, notes: THEME_MAJ, vol: .55 } },                         // twee kampen
  { ch: ['C', 'Am', 'Dm', 'E'], i: [.3, .85], box: [0, .42], seq: [.8, .42, .96, 4, 4], kick: [.62, .96, 1, .9], boom: [.6] }, // Turry
  { ch: ['F', 'C', 'G', 'Am'], i: [.6, 1], seq: [.6, .1, .95, 4, 4], kick: [.3, .95, 1, .8], lead: { from: .08, notes: up(THEME, 12), vol: .8 } }, // jij bent hier
];
const SEQ = [0, 2, 1, 2, 3, 2, 1, 0];

const EV = [];
SCORE.forEach((s, i) => {
  const base = i * DUR, from = s.from || 0, n = s.ch.length, slot = (1 - from) * DUR / n;
  const chordAt = t => CH[s.ch[clamp(Math.floor((t - base - from * DUR) / slot), 0, n - 1)]];
  const beats = (a, z, step, fn) => { for (let k = 0, t = base + Math.ceil(a * DUR / step - 1e-6) * step; t < base + z * DUR - .01; k++, t += step) fn(t, k); };
  s.ch.forEach((c, k) => EV.push({
    t: base + from * DUR + k * slot, type: 'pad', ch: CH[c], dur: slot,
    inten: lerp(s.i[0], s.i[1], n > 1 ? k / (n - 1) : 0), atk: from ? .3 : 1.6,
  }));
  if (s.pluck) {
    const [chs, a, z] = s.pluck, len = (z - a) * DUR / chs.length;
    beats(a, z, BEAT / 4, (t, k) => {
      const c = CH[chs[Math.min(chs.length - 1, Math.floor((t - base - a * DUR) / len))]], st = k % 8;
      EV.push({ t, type: 'pluck', m: st === 0 ? c[1] + 12 : c[[2, 3, 4, 5, 4, 3, 4, 3][st]] + 12, vol: st === 0 ? 1 : .75 });
    });
  }
  if (s.seq) {
    const [lvl, a, z, r0, r1] = s.seq, t0 = base + a * DUR, t1 = base + z * DUR;
    for (let k = 0, t = t0; t < t1 - .01; k++) {
      const c = chordAt(t), q = (t - t0) / (t1 - t0);
      const notes = [c[0] + 12, c[0] + 24, c[2], c[4]];
      EV.push({ t, type: 'seq', m: notes[SEQ[k % 8]], vol: lvl * clamp((t - t0) / 2.5, .35, 1), bright: q });
      t += BEAT / lerp(r0, r1, q * q);
    }
  }
  if (s.kick) { const [a, z, every, vol] = s.kick; beats(a, z, BEAT * every, t => EV.push({ t, type: 'kick', vol })); }
  if (s.bells) beats(.03, .92, BEAT / 2, (t, k) => {
    if (hash(i * 97 + k) > s.bells * .5) return;
    const c = chordAt(t);
    EV.push({ t, type: 'bell', m: c[2 + Math.floor(hash(i * 13 + k) * 4)] + (hash(k * 5 + i) > .5 ? 24 : 12), vol: .6 + .4 * hash(k + i) });
  });
  if (s.box) beats(s.box[0], s.box[1], BEAT / 2, (t, k) => {
    const c = chordAt(t);
    EV.push({ t, type: 'bell', m: c[[2, 3, 4, 5, 4, 3][k % 6]] + 24, vol: .55 });
  });
  if (s.blips) { const [d, a, z] = s.blips; beats(a, z, BEAT / 4, (t, k) => {
    if (hash(i * 31 + k * 1.7) > d * .3) return;
    const c = chordAt(t);
    EV.push({ t, type: 'blip', m: c[2 + Math.floor(hash(k * 3 + i) * 4)] + (hash(k + i * 7) > .5 ? 36 : 24), vol: .5 + .5 * hash(k * 11) });
  }); }
  if (s.lead) {
    let t = base + s.lead.from * DUR;
    for (const [m, b] of s.lead.notes) { EV.push({ t, type: 'lead', m, dur: b * BEAT, vol: s.lead.vol }); t += b * BEAT; }
  }
  for (const p of s.swell || []) {
    const t = base + p * DUR, d = Math.min(2.2, t - base);
    EV.push({ t: t - d, type: 'swell', ch: chordAt(t), dur: d });
    EV.push({ t, type: 'boom' });
  }
  for (const p of s.boom || []) {
    const t = base + p * DUR, d = Math.min(1.8, t - base);
    if (d > .3) EV.push({ t: t - d, type: 'riser', dur: d });
    EV.push({ t, type: 'boom' });
  }
});
EV.sort((a, b) => a.t - b.t);

/* ---------- synthese ---------- */
let ac = null, master, comp, revIn, bus = null, dsend = null, noise;
let muted = false, mode = 'synth', ownUrl = null, fileOk = false;

function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .01; comp.release.value = .3;
  master = ac.createGain(); master.gain.value = muted ? 0 : .9;
  master.connect(comp); comp.connect(ac.destination);
  // galm: zelf gemaakte impulsrespons van 4 seconden
  const len = ac.sampleRate * 4, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  const conv = ac.createConvolver(); conv.buffer = ir;
  revIn = ac.createGain(); revIn.gain.value = .5;
  revIn.connect(conv); conv.connect(master);
  noise = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate);
  const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
function newBus() {
  if (bus) { const old = bus; old.gain.setTargetAtTime(0, ac.currentTime, .06); setTimeout(() => old.disconnect(), 800); }
  bus = ac.createGain(); bus.connect(master); bus.connect(revIn);
  // echo op driekwart tel, die mee uitdooft met de bus
  dsend = ac.createGain();
  const dl = ac.createDelay(2), fb = ac.createGain(), lp = ac.createBiquadFilter();
  dl.delayTime.value = BEAT * .75; fb.gain.value = .38; lp.type = 'lowpass'; lp.frequency.value = 2600;
  dsend.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(bus);
}
function osc(type, f, t, end, dest, gain = 1, detune = 0) {
  const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = detune;
  let node = o;
  if (gain !== 1) { const g = ac.createGain(); g.gain.value = gain; o.connect(g); node = g; }
  node.connect(dest); o.start(t); o.stop(end);
  return o;
}
function env(t, peak, atk, decay) { // gain met korte aanzet en exponentieel uitsterven
  const g = ac.createGain(); g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + atk); g.gain.setTargetAtTime(0, t + atk, decay);
  return g;
}
function lowpass(f, q = 1) { const b = ac.createBiquadFilter(); b.type = 'lowpass'; b.frequency.value = f; b.Q.value = q; return b; }

function pad(e, t, dur, atk) { // brede analoge pad met langzaam ademend filter
  const end = t + dur + 4, inten = e.inten;
  const lp = lowpass(250, 1.5);
  lp.frequency.setValueAtTime(250, t); lp.frequency.linearRampToValueAtTime(700 + 2000 * inten, t + atk * 1.5);
  lp.frequency.linearRampToValueAtTime(500 + 1400 * inten, t + dur);
  const lfo = ac.createOscillator(), lg = ac.createGain();
  lfo.frequency.value = .17; lg.gain.value = 150 + 250 * inten; lfo.connect(lg); lg.connect(lp.frequency); lfo.start(t); lfo.stop(end);
  const g = ac.createGain(); g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(1, t + atk); g.gain.setValueAtTime(1, t + dur); g.gain.setTargetAtTime(0, t + dur, .8);
  lp.connect(g); g.connect(bus);
  const v = .014 * (.5 + inten);
  e.ch.slice(1).forEach((m, k) => {
    const f = freq(m);
    osc('sawtooth', f, t, end, lp, v, -8 + k);
    osc('sawtooth', f, t, end, lp, v, 8 - k);
  });
  const fb = freq(e.ch[0]);
  osc('sine', fb, t, end, g, v * 5);
  osc('sawtooth', fb * 2, t, end, lp, v * .9);
}
function seq(e, t) { // Berlijnse sequencer-bas
  const lp = lowpass(400, 9);
  lp.frequency.setValueAtTime(500 + 2200 * (.4 + .6 * e.bright) * e.vol, t); lp.frequency.exponentialRampToValueAtTime(160, t + .16);
  const g = env(t, .1 * e.vol, .004, .07);
  lp.connect(g); g.connect(bus);
  const f = freq(e.m);
  osc('sawtooth', f, t, t + .45, lp, 1, -5);
  osc('square', f / 2, t, t + .45, lp, .5);
}
function pluck(e, t) { // klavecimbel
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 220;
  const lp = lowpass(5000);
  const g = env(t, .07 * e.vol, .002, .2);
  hp.connect(lp); lp.connect(g); g.connect(bus); g.connect(dsend);
  const f = freq(e.m);
  osc('sawtooth', f, t, t + 1.2, hp, .6);
  osc('square', f * 2, t, t + 1.2, hp, .22, 4);
}
function bell(e, t) { // glas
  const f = freq(e.m);
  const g = env(t, .05 * e.vol, .005, 1); g.connect(bus); g.connect(dsend);
  osc('sine', f, t, t + 5, g);
  const g2 = env(t, .016 * e.vol, .003, .25); g2.connect(bus);
  osc('sine', f * 3.5, t, t + 2, g2);
}
function blip(e, t) { // data-piepje
  const lp = lowpass(4500);
  const g = env(t, .028 * e.vol, .002, .03);
  lp.connect(g); g.connect(bus); g.connect(dsend);
  osc('square', freq(e.m), t, t + .2, lp);
}
function lead(e, t) { // de melodie: twee zaagtanden met vibrato
  const end = t + e.dur + 1.5;
  const lp = lowpass(1400 + 1400 * e.vol, 2);
  const g = ac.createGain(); g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(.06 * e.vol, t + .07); g.gain.setValueAtTime(.06 * e.vol, t + e.dur - .05); g.gain.setTargetAtTime(0, t + e.dur - .05, .18);
  lp.connect(g); g.connect(bus); g.connect(dsend);
  const vib = ac.createOscillator(), vg = ac.createGain();
  vib.frequency.value = 5.2; vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(9, t + Math.min(.6, e.dur)); vib.connect(vg); vib.start(t); vib.stop(end);
  const f = freq(e.m);
  for (const [type, d, gn] of [['sawtooth', -6, .7], ['sawtooth', 6, .7], ['triangle', 0, 1]]) {
    const o = osc(type, f, t, end, lp, gn, d); vg.connect(o.detune);
  }
}
function kick(e, t) { // zachte basdrum
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
  const g = env(t, .32 * e.vol, .003, .14); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1);
}
function swell(e, t) { // aanzwellend koper-akkoord
  const end = t + e.dur + 2;
  const lp = lowpass(250, 3);
  lp.frequency.setValueAtTime(250, t); lp.frequency.exponentialRampToValueAtTime(3200, t + e.dur);
  lp.frequency.setTargetAtTime(600, t + e.dur, .5);
  const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.03, t + e.dur); g.gain.setTargetAtTime(0, t + e.dur, .6);
  lp.connect(g); g.connect(bus);
  for (const m of [e.ch[0] + 12, ...e.ch.slice(2)]) for (const d of [-10, 0, 10]) osc('sawtooth', freq(m), t, end, lp, 1, d);
}
function boom(t) { // diepe klap
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(75, t); o.frequency.exponentialRampToValueAtTime(26, t + 2.2);
  const g = env(t, .45, .01, 1.1); o.connect(g); g.connect(bus); o.start(t); o.stop(t + 5);
  const s = ac.createBufferSource(); s.buffer = noise;
  const nl = lowpass(900);
  const ng = env(t, .14, .005, .7); s.connect(nl); nl.connect(ng); ng.connect(bus); s.start(t, 0, 2.9);
}
function riser(e, t) { // aanzwellen voor de klap
  const s = ac.createBufferSource(); s.buffer = noise;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(250, t); bp.frequency.exponentialRampToValueAtTime(5000, t + e.dur);
  const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.2, t + e.dur); g.gain.linearRampToValueAtTime(0, t + e.dur + .06);
  s.connect(bp); bp.connect(g); g.connect(bus); s.start(t, 0, e.dur + .1);
}
function play(e, t) {
  switch (e.type) {
    case 'pad': pad(e, t, e.dur, e.atk); break;
    case 'seq': seq(e, t); break;
    case 'pluck': pluck(e, t); break;
    case 'bell': bell(e, t); break;
    case 'blip': blip(e, t); break;
    case 'lead': lead(e, t); break;
    case 'kick': kick(e, t); break;
    case 'swell': swell(e, t); break;
    case 'boom': boom(t); break;
    case 'riser': riser(e, t); break;
  }
}

/* ---------- synchroon met de animatie ---------- */
const LOOK = .3;
let anchor = 0, idx = 0;
function reset(T) {
  newBus();
  anchor = ac.currentTime - T;
  idx = EV.findIndex(e => e.t >= T); if (idx < 0) idx = EV.length;
  for (let k = idx - 1; k >= 0; k--) { // het akkoord dat al klinkt, meteen laten klinken
    const e = EV[k];
    if (e.type !== 'pad') continue;
    if (e.t + e.dur > T + .3) pad(e, ac.currentTime + .02, e.t + e.dur - T, .5);
    break;
  }
}
function schedule(T) {
  const drift = ac.currentTime - anchor - T;
  if (Math.abs(drift) > .04) anchor = ac.currentTime - T;
  while (idx < EV.length && EV[idx].t < T + LOOK) {
    const e = EV[idx++], at = anchor + e.t;
    if (at < ac.currentTime - .05 && e.type !== 'pad' && e.type !== 'boom' && e.type !== 'swell') continue;
    play(e, Math.max(at, ac.currentTime + .005));
  }
}

const track = $('track'), tag = $('music-tag'), muteBtn = $('mute'), ownBtn = $('own'), ownFile = $('own-file');
track.addEventListener('loadedmetadata', () => { fileOk = true; if (!ownUrl && started) setMode('file'); });
track.addEventListener('error', () => { fileOk = false; if (mode === 'file') setMode('synth'); });

let started = false, lastT = H.T, lastWall = performance.now() / 1000, wasPlaying = H.playing;
function setMode(m) {
  mode = m;
  ownBtn.classList.toggle('active', m === 'file');
  ownBtn.setAttribute('aria-label', m === 'file' ? 'Terug naar de ingebouwde score' : 'Eigen muziekbestand kiezen');
  ownBtn.title = ownBtn.getAttribute('aria-label');
  if (!ac) return;
  if (m === 'file') {
    if (bus) { newBus(); }
    master.gain.setTargetAtTime(0, ac.currentTime, .05);
    track.currentTime = track.duration ? H.T % track.duration : 0;
    track.muted = muted;
    if (H.playing) track.play().catch(() => {});
    const name = ownUrl ? ownFile.files[0].name.replace(/\.[^.]+$/, '') : 'soundtrack';
    tag.textContent = '♪ ' + name;
  } else {
    track.pause();
    master.gain.setTargetAtTime(muted ? 0 : .9, ac.currentTime, .05);
    reset(H.T);
    tag.textContent = '♪ synthesizerscore in de stijl van Vangelis';
  }
}
// De muziek start vanzelf. Houdt de browser geluid tegen tot de eerste klik of toets,
// dan start die eerste klik of spatie alleen de muziek en pauzeert hij de animatie niet.
let locked = false;
function start() {
  if (started) return;
  started = true;
  initAudio();
  if (track.readyState >= 1 && !track.error) fileOk = true;
  setMode(fileOk ? 'file' : 'synth');
  if (!H.playing) { ac.suspend(); return; }
  ac.resume().catch(() => {});
  setTimeout(() => { if (ac.state !== 'running') locked = true; }, 300);
}
function unlock(e) {
  if (!locked) return;
  locked = false;
  ac.resume().then(() => { if (mode === 'file') setMode('file'); else reset(H.T); }).catch(() => {});
  if (e.type === 'keydown' ? e.code === 'Space' : !e.target.closest('#controls')) {
    e.preventDefault(); e.stopImmediatePropagation();
    if (e.type === 'pointerdown') window.addEventListener('click', ev => ev.stopImmediatePropagation(), { capture: true, once: true });
  }
}
window.addEventListener('pointerdown', unlock, true);
window.addEventListener('keydown', unlock, true);
window.addEventListener('keydown', e => { if (e.key === 'm' || e.key === 'M') toggleMute(); });
start();

function toggleMute() {
  muted = !muted;
  muteBtn.classList.toggle('off', muted);
  muteBtn.setAttribute('aria-label', muted ? 'Muziek aanzetten' : 'Muziek dempen');
  muteBtn.title = muted ? 'Muziek aanzetten (M)' : 'Muziek dempen (M)';
  track.muted = muted;
  if (ac && mode === 'synth') master.gain.setTargetAtTime(muted ? 0 : .9, ac.currentTime, .08);
}
muteBtn.addEventListener('click', toggleMute);
ownBtn.addEventListener('click', () => {
  if (mode === 'file') { setMode('synth'); return; }
  ownFile.click();
});
ownFile.addEventListener('change', () => {
  const f = ownFile.files[0]; if (!f) return;
  if (ownUrl) URL.revokeObjectURL(ownUrl);
  ownUrl = URL.createObjectURL(f);
  track.src = ownUrl;
  track.addEventListener('loadedmetadata', () => setMode('file'), { once: true });
});

document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) { ac.suspend(); track.pause(); }
  else if (H.playing) { ac.resume(); if (mode === 'file') track.play().catch(() => {}); }
});

setInterval(() => {
  const T = H.T, playing = H.playing, wall = performance.now() / 1000;
  const expected = lastT + (wasPlaying ? wall - lastWall : 0);
  const jumped = Math.abs(T - expected) > .45;
  if (ac && !document.hidden) {
    if (playing !== wasPlaying) {
      if (playing) { ac.resume(); if (mode === 'file') track.play().catch(() => {}); }
      else { ac.suspend(); track.pause(); }
    }
    if (mode === 'file') {
      if (jumped && track.duration) track.currentTime = T % track.duration;
    } else if (playing || jumped) {
      if (jumped) reset(T);
      if (playing && ac.state === 'running') schedule(T);
    }
  }
  lastT = T; lastWall = wall; wasPlaying = playing;
}, 50);
})();

</script>
</body>
</html>
