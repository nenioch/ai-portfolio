<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoe computers leerden praten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="scene" aria-label="Animatie over de geschiedenis van taalmodellen"></canvas>
<div id="vignette"></div>
<div id="fade"></div>

<header id="kop" class="overlay">
  <p class="eyebrow">Geschiedenis van taalmodellen · 1966–2026</p>
  <p class="naam">Hoe computers leerden praten</p>
</header>

<div id="klok" class="overlay">
  <span id="year">LLM</span>
  <span id="scene-no">scène 1 van 10</span>
</div>

<section id="lower" class="overlay" aria-live="polite">
  <span id="lower-idx">01 / 10</span>
  <h2 id="lower-title"></h2>
  <p id="lower-txt"></p>
  <p id="lower-fact"></p>
</section>

<div id="controls">
  <button id="prev" type="button" aria-label="Vorige scène">
    <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
  </button>
  <button id="play" type="button" aria-label="Pauzeren">
    <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>
  </button>
  <button id="next" type="button" aria-label="Volgende scène">
    <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
  </button>
  <div id="timeline"></div>
  <span id="time">0:00 / 0:00</span>
</div>

<div id="hint">klik pauzeert · spatie pauzeert · ← → scènes · H verbergt de tekst</div>

<script src="scenes.js"></script>
<script src="main.js"></script>
</body>
</html>
